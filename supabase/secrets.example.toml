# SALIN NILAINYA KE: Streamlit Cloud -> Manage app -> Settings -> Secrets
# JANGAN COMMIT file .streamlit/secrets.toml ke GitHub.
# PUBLISHABLE/ANON key adalah public key, BUKAN service_role / sb_secret_ key.

public_base_url = "https://NAMA-APP.streamlit.app"

[supabase]
url = "https://NAMA-PROJECT.supabase.co"
publishable_key = "sb_publishable_CONTOH_BUKAN_KEY_ASLI"

# public_base_url di atas adalah alamat website kamu (HTTPS, bukan Supabase URL).
